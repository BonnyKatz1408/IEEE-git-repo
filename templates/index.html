<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WayPoint — Interactive GitHub Architecture & Dependency Graphs</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- External Stylesheet -->
  <link rel="stylesheet" href="../static/css/index.css" />
</head>

<body>
  <!-- Interactive Background Canvas & Dependency Graph Layer -->
  <div class="background-graph-layer bg-graph-matrix">
    <canvas id="graphCanvas" class="graph-canvas"></canvas>
    <div id="nodesOverlay" class="nodes-overlay"></div>
    <div class="vignette-linear"></div>
    <div class="vignette-radial"></div>
  </div>

  <!-- Header Navigation -->
  <header class="site-header">
    <div class="header-container">
      <a href="#" class="brand-link">
        <div class="brand-logo-wrapper">
          <img src="../static/images/logo.png" alt="WayPoint Logo" class="brand-logo" />
        </div>
        <div class="brand-title-wrap">
          <span class="brand-name">WayPoint</span>
        </div>
      </a>

      <div class="header-actions">
        <a href="/analyze" class="btn btn-primary btn-sm">
          Try it
        </a>
      </div>
    </div>
  </header>

  <!-- Main Hero Area -->
  <main class="hero-section">
    <div class="hero-container">
      <h1 class="hero-title">
        Understand any codebase in seconds.
      </h1>

      <p class="hero-subtitle">
        Instantly map internal architecture, inspect cross-module imports, and explore visual dependency graphs for open source and private repositories.
      </p>

      <div class="hero-cta-group">
        <a href="/analyze" class="btn btn-primary btn-lg">
          <span>Try it now</span>
          <svg class="icon-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </a>

        <button id="demoBtn" onclick="pulseBackgroundGraph()" class="btn btn-secondary btn-lg">
          <svg class="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span class="truncate">Explore graph node demo</span>
        </button>
      </div>
    </div>
  </main>

  <script src="../static/js/index.js"></script>
</body>
</html>
