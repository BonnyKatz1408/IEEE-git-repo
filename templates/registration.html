<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayPoint — Registration</title>
    <link rel="stylesheet" href="../static/css/registration.css">
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <!-- Floating UI Node Badges -->
    <div id="node-overlay-container"></div>

    <!-- Header Brand -->
    <a href="/" class="brand-header">
        <div class="brand-logo">
            <img src="../static/images/logo.png" alt="" height="40">
        </div>
        <span class="brand-name">WayPoint</span>
    </a>

    <div class="registration-container">
        <div class="card">
            
            <div id="form-content">
                <div class="form-header">
                    <h2>Create Account</h2>
                </div>

                <form id="registration-form" onsubmit="handleRegister(event)">
                    <div class="input-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" class="input-control" placeholder="Alex Mercer" required>
                    </div>
                    <div class="input-group">
                        <label for="email">Work Email</label>
                        <input type="email" id="email" class="input-control" placeholder="alex@company.com" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="input-control" placeholder="••••••••••••" required minlength="8">
                    </div>
                    <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" class="input-control" placeholder="••••••••••••" required minlength="8">
                        <div class="error-message" id="password-match-error">Passwords do not match.</div>
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary" id="btn-submit">Create Account</button>
                    </div>
                </form>
            </div>

            <div class="success-overlay" id="success-screen">
                <div class="success-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <h3>Welcome to WayPoint</h3>
                <p>Your account is ready. Setting up your workspace now.</p>
            </div>

        </div>
    </div>

    <script src="../static/js/registration.js"></script>
</body>
</html>
